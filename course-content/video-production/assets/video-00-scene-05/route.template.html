<!doctype html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tu ruta en 7 pasos | LC</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;background:#eaf0f5;font-family:Arial,Helvetica,sans-serif;color:#14283d}
  body{overflow:hidden}
  #stage{width:1920px;height:1080px;position:absolute;transform-origin:top left;background:#fff;overflow:hidden}
  .grid{position:absolute;inset:0;background-image:radial-gradient(#d7e5ef 1.5px,transparent 1.5px);background-size:36px 36px;opacity:.3}
  .halo{position:absolute;width:1060px;height:1060px;border-radius:50%;right:-520px;top:-620px;background:radial-gradient(circle,#dfeffa,transparent 68%)}
  header{position:absolute;left:96px;top:64px;display:flex;gap:28px;align-items:center}
  .mark{background:#003366;color:#fff;border-radius:18px;padding:16px 20px;font-size:32px;font-weight:800}
  .brand{font-size:20px;letter-spacing:3px;color:#003366}
  .course{position:absolute;right:96px;top:88px;font-size:20px;letter-spacing:2px;color:#597389}
  h1{position:absolute;left:96px;top:164px;font-size:68px;letter-spacing:-2px;margin:0;color:#003366}
  .subtitle{position:absolute;left:100px;top:264px;font-size:29px;color:#60758a}
  .map{position:absolute;left:96px;top:334px;width:1728px;height:548px;border:2px solid #dce9f2;border-radius:40px;background:linear-gradient(180deg,#fbfdff,#f3f8fc);box-shadow:0 24px 68px #0033660d;overflow:hidden}
  .map::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#fff9 50%,transparent);transform:translateX(-100%)}
  .route-svg{position:absolute;inset:0;width:100%;height:100%}
  .route-base{fill:none;stroke:#d8e5ef;stroke-width:14;stroke-linecap:round}
  .route-fill{fill:none;stroke:#00aeef;stroke-width:14;stroke-linecap:round;filter:drop-shadow(0 8px 11px #00aeef35)}
  .node{position:absolute;width:64px;height:64px;border-radius:50%;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;background:#e3edf5;border:7px solid #fff;box-shadow:0 0 0 3px #b9cfe0,0 12px 30px #0033661c;color:#0055a4;font-size:26px;font-weight:800;z-index:3}
  .step{position:absolute;width:202px;min-height:92px;transform:translateX(-50%);padding:20px 18px;border-radius:22px;background:#fff;border:2px solid #e2ebf3;box-shadow:0 14px 32px #0033660c;text-align:center;color:#536b7f;font-size:25px;line-height:1.12;font-weight:700;display:flex;align-items:center;justify-content:center;z-index:2}
  .tracer{position:absolute;width:28px;height:28px;border-radius:50%;transform:translate(-50%,-50%);background:#00aeef;border:6px solid #fff;box-shadow:0 0 0 5px #00aeef,0 0 42px #00aeef;z-index:5}
  .closing{position:absolute;left:50%;bottom:57px;transform:translateX(-50%);padding:17px 32px;border:2px solid #b9dcf0;border-radius:50px;background:#fff;color:#003366;font-size:25px;font-weight:700;letter-spacing:.2px;box-shadow:0 14px 34px #0033660d}
  .footer{position:absolute;bottom:35px;left:96px;color:#62758b;font-size:19px}
  .duration{position:absolute;bottom:35px;right:96px;font-size:19px;color:#62758b}
  .progress{position:absolute;bottom:0;height:7px;background:#00aeef;width:1920px;transform-origin:left}
  .controls{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:9}
  button{padding:9px 18px;border:1px solid #b7cede;background:#fff;color:#003366;border-radius:20px;cursor:pointer}
  body.capture .controls{display:none}
  @media (prefers-reduced-motion:reduce){.map::before{display:none}}
</style>
<body>
<main id="stage">
  <div class="grid"></div><div class="halo"></div>
  <header><div class="mark">LC</div><div class="brand">LANGUAGE<br>CENTER CHILE</div></header>
  <div class="course"></div><h1></h1><div class="subtitle"></div>
  <section class="map" aria-label="Ruta animada de siete pasos">
    <svg class="route-svg" viewBox="0 0 1728 548" aria-hidden="true">
      <path class="route-base" d="M130 360 C210 360 250 230 360 230 S500 360 610 360 S750 230 860 230 S1000 360 1110 360 S1250 230 1360 230 S1510 360 1595 360"/>
      <path class="route-fill" d="M130 360 C210 360 250 230 360 230 S500 360 610 360 S750 230 860 230 S1000 360 1110 360 S1250 230 1360 230 S1510 360 1595 360"/>
    </svg>
    <div class="tracer" aria-hidden="true"></div>
  </section>
  <div class="closing"></div>
  <div class="footer">Animación didáctica · Sin narración</div>
  <div class="duration">00:08 / FULL HD</div>
  <div class="progress"></div>
</main>
<div class="controls"><button id="pause">Pausa / Play</button><button id="restart">Reiniciar</button></div>
{{GSAP_SCRIPT}}
<script>
  const spec={{SPEC_JSON}};
  const points=[
    {x:130,y:360},{x:360,y:230},{x:610,y:360},{x:860,y:230},
    {x:1110,y:360},{x:1360,y:230},{x:1595,y:360}
  ];
  document.querySelector('.course').textContent=spec.course;
  document.querySelector('h1').textContent=spec.title;
  document.querySelector('.subtitle').textContent=spec.subtitle;
  document.querySelector('.closing').textContent=spec.closing;
  const map=document.querySelector('.map');
  const nodes=[];
  const cards=[];
  spec.steps.forEach((name,index)=>{
    const point=points[index];
    const node=document.createElement('div');
    node.className='node';node.textContent=String(index+1).padStart(2,'0');
    node.style.left=point.x+'px';node.style.top=point.y+'px';
    const card=document.createElement('div');
    card.className='step';card.textContent=name;
    card.style.left=point.x+'px';card.style.top=(point.y<300?point.y-126:point.y+45)+'px';
    map.append(node,card);nodes.push(node);cards.push(card);
  });
  const tracer=document.querySelector('.tracer');
  const fill=document.querySelector('.route-fill');
  const length=fill.getTotalLength();
  const tl=gsap.timeline({paused:true,defaults:{ease:'power3.out'}});
  gsap.set(['header','.course','h1','.subtitle'],{autoAlpha:.42,y:24});
  gsap.set('.map',{autoAlpha:0,y:42,scale:.975});
  gsap.set(fill,{strokeDasharray:length,strokeDashoffset:length});
  gsap.set(tracer,{left:points[0].x,top:points[0].y,autoAlpha:0,scale:.5});
  gsap.set(nodes,{autoAlpha:.42,scale:.82});
  gsap.set(cards,{autoAlpha:.28,y:14});
  gsap.set('.closing',{autoAlpha:0,y:18});
  gsap.set('.progress',{scaleX:0});
  tl.to('header',{autoAlpha:1,y:0,duration:.55},0)
    .to('.course',{autoAlpha:1,y:0,duration:.55},.08)
    .to('h1',{autoAlpha:1,y:0,duration:.65},.18)
    .to('.subtitle',{autoAlpha:1,y:0,duration:.6},.3)
    .to('.map',{autoAlpha:1,y:0,scale:1,duration:.7},.42)
    .to('.map',{ '--sweep': 1, duration:.01 },.42)
    .to(tracer,{autoAlpha:1,scale:1,duration:.35},.85);
  points.forEach((point,index)=>{
    const start=.9+index*.73;
    if(index>0) tl.to(tracer,{left:point.x,top:point.y,duration:.58,ease:'power2.inOut'},start);
    tl.to(fill,{strokeDashoffset:length*(1-(index+1)/7),duration:.58,ease:'power2.inOut'},start)
      .to(nodes[index],{autoAlpha:1,scale:1.18,backgroundColor:'#00aeef',color:'#003366',boxShadow:'0 0 0 4px #00aeef, 0 14px 34px #00336625',duration:.28},start+.18)
      .to(cards[index],{autoAlpha:1,y:0,color:'#003366',borderColor:'#9bdcf5',duration:.35},start+.2);
    if(index>0){
      tl.to(nodes[index-1],{scale:1,backgroundColor:'#0055a4',color:'#fff',boxShadow:'0 0 0 3px #b9cfe0, 0 12px 30px #0033661c',duration:.26},start+.42);
    }
  });
  tl.to(nodes[6],{scale:1,backgroundColor:'#0055a4',color:'#fff',duration:.3},6.05)
    .to(cards,{autoAlpha:1,color:'#003366',borderColor:'#d1e6f2',duration:.45},6.1)
    .to('.closing',{autoAlpha:1,y:0,duration:.55},6.22)
    .to('.map',{boxShadow:'0 28px 78px #0055a41f',duration:.65},6.25)
    .to('.progress',{scaleX:1,duration:spec.duration,ease:'none'},0);
  const update=t=>document.getElementById('pause').textContent=tl.paused()?'Play':'Pausa';
  tl.eventCallback('onUpdate',()=>update(tl.time()));
  window.renderAt=t=>{tl.pause();tl.time(Math.max(0,Math.min(spec.duration,Number(t)||0)),false);update(t)};
  window.animation=tl;
  window.duration = spec.duration;
  document.getElementById('pause').onclick=()=>tl.paused()?tl.play():tl.pause();
  document.getElementById('restart').onclick=()=>tl.restart();
  addEventListener('resize',()=>{const s=Math.min(innerWidth/1920,innerHeight/1080);document.getElementById('stage').style.transform=`scale(${s})`});
  dispatchEvent(new Event('resize'));
  if(location.search.includes('capture')){document.body.classList.add('capture');window.renderAt(0)}
  else if(matchMedia('(prefers-reduced-motion: reduce)').matches){window.renderAt(spec.duration)}
  else{tl.repeat(-1).repeatDelay(1).play()}
</script>
</body>
</html>
