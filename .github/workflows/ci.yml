name: CI — Static Landing

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify required files
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html styles.css script.js assets/logo-lc.png assets/logo-aleph.png; do
            test -s "$file"
          done

      - name: Check JavaScript syntax
        run: node --check script.js

      - name: Verify local asset references
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const refs = [...html.matchAll(/(?:href|src)="([^"#]+)"/g)]
            .map((match) => match[1])
            .filter((ref) => !/^(?:https?:|mailto:|tel:)/.test(ref));
          const missing = [...new Set(refs)].filter((ref) => !fs.existsSync(ref));
          if (missing.length) {
            console.error(`Missing local references: ${missing.join(', ')}`);
            process.exit(1);
          }
          NODE

      - name: Verify new-tab link isolation
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const newTabLinks = [...html.matchAll(/<a\b[^>]*\btarget\s*=\s*["']_blank["'][^>]*>/gi)]
            .map((match) => match[0]);
          const unsafe = newTabLinks.filter((tag) => {
            const rel = tag.match(/\brel\s*=\s*["']([^"']*)["']/i)?.[1] ?? '';
            return !rel.split(/\s+/).includes('noopener');
          });
          if (unsafe.length) {
            console.error(`New-tab links missing rel="noopener": ${unsafe.length}`);
            process.exit(1);
          }
          NODE

      - name: Verify internal navigation targets
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const idValues = [...html.matchAll(/\sid="([^"]+)"/g)].map((match) => match[1]);
          const ids = new Set(idValues);
          const duplicates = [...new Set(idValues.filter((id, index) => idValues.indexOf(id) !== index))];
          if (duplicates.length) {
            console.error(`Duplicate IDs: ${duplicates.join(', ')}`);
            process.exit(1);
          }
          const targets = [...html.matchAll(/href="#([^"]+)"/g)].map((match) => match[1]);
          const missing = [...new Set(targets)].filter((target) => !ids.has(target));
          if (missing.length) {
            console.error(`Missing internal targets: ${missing.map((id) => `#${id}`).join(', ')}`);
            process.exit(1);
          }
          NODE
